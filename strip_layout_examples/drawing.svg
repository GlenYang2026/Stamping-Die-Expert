<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff" stroke="#cccccc"/>
  <text x="20" y="28" font-family="Arial" font-size="16" font-weight="bold">圆筒拉深示意（毛坯 → 拉深件）</text>

  <!-- 毛坯圆 -->
  <circle cx="130" cy="170" r="80" fill="#e0e0ff" stroke="#0000aa"/>
  <text x="110" y="175" font-size="13">毛坯 D</text>

  <!-- 箭头 -->
  <line x1="220" y1="170" x2="300" y2="170" stroke="#888" stroke-width="2" marker-end="url(#ah)"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- 拉深件剖面 -->
  <path d="M 360 110 L 360 230 L 440 230 L 440 110" fill="none" stroke="#0000aa" stroke-width="3"/>
  <path d="M 360 110 Q 400 90 440 110" fill="none" stroke="#0000aa" stroke-width="3"/>
  <text x="362" y="180" font-size="13">d</text>
  <text x="400" y="255" font-size="13">h</text>
  <line x1="360" y1="245" x2="440" y2="245" stroke="#888" stroke-width="1"/>
  <text x="362" y="100" font-size="12" fill="#ff0000">凹模圆角 r</text>

  <text x="470" y="140" font-size="12">D = √(d²+4dh)</text>
  <text x="470" y="162" font-size="12">m = d/D（拉深比）</text>
  <text x="470" y="184" font-size="12">F_d = π·d·t·σb·(D/d−0.7)</text>
  <text x="470" y="206" font-size="12">m 超界 → 多次拉深</text>
  <text x="470" y="228" font-size="12">法兰需压边防皱</text>
</svg>
